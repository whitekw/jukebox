services:
  jukebox:
    image: "ghcr.io/whitekw/jukebox:sha-15cac0bafda5960ff70819fed17cca234e4a0163"
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_PATH: /app/data/jukebox.sqlite
      ROOM_TTL_HOURS: "${ROOM_TTL_HOURS:-24}"
      EMPTY_ROOM_TTL_HOURS: "${EMPTY_ROOM_TTL_HOURS:-1}"
      PARTICIPANT_LEAVE_GRACE_MS: "${PARTICIPANT_LEAVE_GRACE_MS:-5000}"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:?Set YOUTUBE_API_KEY in Portainer}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
    ports:
      - "${JUKEBOX_PORT:-3001}:3001"
    volumes:
      - jukebox-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  jukebox-data:
    external: true
    name: jukebox-data

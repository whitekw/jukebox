services:
  jukebox:
    image: "ghcr.io/whitekw/jukebox:sha-7e5936418d143981a57a73d77688ae3626d790bc"
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_PATH: /app/data/jukebox.sqlite
      PARTICIPANT_LEAVE_GRACE_MS: "${PARTICIPANT_LEAVE_GRACE_MS:-5000}"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:?Set YOUTUBE_API_KEY in Portainer}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      DISCORD_REDIRECT_URI: "${DISCORD_REDIRECT_URI:-}"
      BROWSER_EXTENSION_IDS: "${BROWSER_EXTENSION_IDS:-}"
      AUTH_SESSION_TTL_DAYS: "${AUTH_SESSION_TTL_DAYS:-30}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
      ADMIN_DISCORD_IDS: "${ADMIN_DISCORD_IDS:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
      OAUTH_TOKEN_ENCRYPTION_KEY: "${OAUTH_TOKEN_ENCRYPTION_KEY:-}"
    ports:
      - "${JUKEBOX_PORT:-3001}:3001"
    volumes:
      - jukebox-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  jukebox-data:
    external: true
    name: jukebox-data

name: Test and publish container

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            admin/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.6.2

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Test admin
        working-directory: admin
        run: npm test

      - name: Lint admin
        working-directory: admin
        run: npm run lint

      - name: Build admin
        working-directory: admin
        run: npm run build

  publish:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs:
      - test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/whitekw/jukebox:master
            ghcr.io/whitekw/jukebox:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs:
      - publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source deployment template
        uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout deploy branch
        uses: actions/checkout@v6
        with:
          ref: deploy
          path: deploy

      - name: Update deployment manifest
        working-directory: deploy
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          cp ../source/compose.deploy.yaml compose.deploy.yaml
          sed -i \
            "s|^[[:space:]]*image:.*ghcr.io/whitekw/jukebox.*|    image: \"ghcr.io/whitekw/jukebox:${IMAGE_TAG}\"|" \
            compose.deploy.yaml

      - name: Commit deployment
        working-directory: deploy
        run: |
          if git diff --quiet; then
            echo "Deployment image is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compose.deploy.yaml
          git commit -m "Deploy ${GITHUB_SHA}"
          git push origin HEAD:deploy
